name: Chat 2 Vanilla
author: Infi, Anna
punchline: Chat 2 that looks like the vanilla chat window.
description: |-
  A Chat 2 fork that looks like the game's own chat window, with unlimited tabs.
  Turn off Vanilla style for the normal Chat 2 look. Installs alongside Chat 2.

  Based on Chat 2 by Anna and Infi (EUPL-1.2): https://github.com/Infiziert90/ChatTwo
repo_url: https://github.com/Requine-Moegi/ChatTwoVanilla
icon_url: https://raw.githubusercontent.com/Requine-Moegi/ChatTwoVanilla/main/ChatTwo/images/icon.png
accepts_feedback: true
tags:
  - Social
  - UI
  - Chat
  - Replacement
changelog: |-
  **1.43.21**
  - Switching back to a tab stays at the bottom

  **1.43.20**
  - Logs and pop-outs open at the bottom

  **1.43.19**
  - Pop-out logs stay still at Dalamud scale 1.5
  - "You obtain" lines fall back to the vanilla yellow
  - Clone button on each tab in settings

  **1.43.18**
  - Pop-out logs stay put when new lines arrive
  - "You obtain" lines use the game's loot color

  **1.43.17**
  - Tab and channel labels follow the Font size setting

  **1.43.16**
  - Wrapped chat lines no longer gain extra space when Dalamud's scale is above 1

  **1.43.15**
  - Option to tint the input box only while typing

  **1.43.14**
  - Pop-outs remember their position and size

  **1.43.13**
  - Font size setting in Vanilla Style; text no longer scales with Dalamud

  **1.43.12**
  - Chat text size now matches the game when Dalamud's scale differs

  **1.43.11**
  - Import your tabs from the game's chat settings
  - Optional input box tint by chat channel
  - Per-tab log background color and log transparency setting
  - Toggle for the gold highlight on tabs with new messages
  - Vanilla Style settings now have their own tab, with shorter descriptions
  - Fixed pop-out resizing, saving, and text spilling past the log
  - More reliable game font on all machines

  **1.42.0**
  - First release
